<meta charset="utf-8">

<title>De Medicijnman</title>
<style>
:root { --papier: #faf6ef; --inkt: #1d1a16; --accent: #7a1f1f; --rand: #e4dccc; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --papier: #15130f; --inkt: #e8e2d6; --accent: #d08770; --rand: #2c2820; }
}
:root[data-theme="dark"] { --papier: #15130f; --inkt: #e8e2d6; --accent: #d08770; --rand: #2c2820; }
html, body { margin: 0; padding: 0; background: var(--papier); color: var(--inkt); }
body { font-family: Georgia, 'Times New Roman', serif; line-height: 1.65; font-size: 1.06rem; }
.balk { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center;
  padding: .7rem 1rem; background: var(--papier); border-bottom: 1px solid var(--rand); z-index: 5; }
.balk .titel { font-variant: small-caps; letter-spacing: .08em; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; margin-right: .8rem; }
.balk select { font: inherit; font-size: .95rem; color: var(--accent); background: var(--papier);
  border: 1px solid var(--accent); border-radius: 6px; padding: .35rem .6rem; font-weight: bold;
  max-width: 60vw; cursor: pointer; }
main { max-width: 40rem; margin: 0 auto; padding: 1.5rem 16px 2rem; }
.hfst[hidden] { display: none; }
.nav { max-width: 40rem; margin: 0 auto 4rem; padding: 0 16px; display: flex; justify-content: space-between;
  gap: 1rem; }
.nav button { font: inherit; font-size: .95rem; color: var(--accent); background: transparent;
  border: 1px solid var(--accent); border-radius: 6px; padding: .5rem 1rem; cursor: pointer; }
.nav button[hidden] { visibility: hidden; display: inline-block; }
h2.kop { font-size: 2.2rem; text-align: center; margin: 3.2rem 0 2.2rem; font-weight: normal; }
h2.kop::before { content: 'Hoofdstuk '; font-size: 1rem; display: block; letter-spacing: .25em;
  text-transform: uppercase; opacity: .55; margin-bottom: .4rem; }
p { margin: 0; text-indent: 1.5em; }
p.eerste { text-indent: 0; }
.wit { height: 1.1em; }
#slot { position: fixed; inset: 0; background: var(--papier); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1rem; z-index: 10; padding: 16px; }
#slot h1 { font-variant: small-caps; letter-spacing: .1em; font-weight: normal; }
#slot input { font-size: 1.1rem; padding: .6rem .9rem; border: 1px solid var(--rand); border-radius: 8px;
  background: transparent; color: var(--inkt); width: min(18rem, 80vw); text-align: center; }
#slot button { font-size: 1rem; padding: .6rem 1.4rem; border: none; border-radius: 8px;
  background: var(--accent); color: var(--papier); cursor: pointer; }
#fout { color: var(--accent); min-height: 1.3em; margin: 0; }
</style>
</head>

  const alles = keuze === 'alles';
  let idx = secties.findIndex(s => s.id === keuze);
  if (!alles && idx < 0) { idx = secties.length - 1; keuze = secties[idx].id; }
  secties.forEach((s, i) => { s.hidden = !alles && i !== idx; });
  kies.value = keuze;
  const vorige = document.getElementById('vorige'), volgende = document.getElementById('volgende');
  vorige.hidden = alles || idx <= 0;
  volgende.hidden = alles || idx >= secties.length - 1;
  vorige.onclick = () => toon(secties[idx - 1].id, true);
  volgende.onclick = () => toon(secties[idx + 1].id, true);
  if (location.hash !== '#' + keuze) history.replaceState(null, '', '#' + keuze);
  if (scroll) window.scrollTo(0, 0);
}
function bouwKeuzelijst(){
  const secties = [...document.querySelectorAll('.hfst')];
  const kies = document.getElementById('kies');
  secties.forEach((s, i) => {
    const o = document.createElement('option');
    o.value = s.id;
    o.textContent = 'Hoofdstuk ' + s.dataset.nr + (i === secties.length - 1 ? ' (nieuwste)' : '');
    kies.appendChild(o);
  });
  const a = document.createElement('option');
  a.value = 'alles'; a.textContent = 'Alle hoofdstukken';
  kies.appendChild(a);
  kies.addEventListener('change', () => toon(kies.value, true));
  window.addEventListener('hashchange', () => toon(location.hash.slice(1), true));
}
async function probeer(ww){
  try {
    const tekst = await ontgrendel(ww);
    document.getElementById('inhoud').innerHTML = tekst;
    document.getElementById('inhoud').style.display = 'block';
    document.getElementById('balk').style.display = 'flex';
    document.getElementById('nav').style.display = 'flex';
    document.getElementById('slot').remove();
    bouwKeuzelijst();
    toon(location.hash.slice(1), false);
    try { sessionStorage.setItem('mm-ww', ww); } catch(e) {}
    return true;
  } catch(e) { return false; }
}
document.getElementById('open').addEventListener('click', async () => {
  const ok = await probeer(document.getElementById('ww').value);
  if (!ok) document.getElementById('fout').textContent = 'Onjuist wachtwoord.';
});
document.getElementById('ww').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('open').click();
});
(async () => {
  let w = null;
  try { w = sessionStorage.getItem('mm-ww'); } catch(e) {}
  if (w) await probeer(w);
})();
</script>
