    basis, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const klare = await crypto.subtle.decrypt({name:'AES-GCM', iv}, sleutel, rest);
  return new TextDecoder().decode(klare);
}
async function probeer(ww){
  try {
    const tekst = await ontgrendel(ww);
    document.getElementById('inhoud').innerHTML = tekst;
    document.getElementById('inhoud').style.display = 'block';
    document.getElementById('balk').style.display = 'flex';
    document.getElementById('slot').remove();
    try { sessionStorage.setItem('mm-ww', ww); } catch(e) {}
    return true;
  } catch(e) { return false; }
}
document.getElementById('open').addEventListener('click', async () => {
  const ok = await probeer(document.getElementById('ww').value);
  if (!ok) document.getElementById('fout').textContent = 'Onjuist wachtwoord.';
});
document.getElementById('ww').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('open').click();
});
(async () => {
  let w = null;
  try { w = sessionStorage.getItem('mm-ww'); } catch(e) {}
  if (w) await probeer(w);
})();
</script>
